<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1P — 3D koncept firemní budovy</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #14121a;
    font: 13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; color: #f2eee9; }
  canvas { display: block; }

  #panel { position: fixed; top: 10px; left: 10px; width: 274px; max-height: calc(100vh - 20px);
    overflow-y: auto; background: rgba(22,19,28,.9); backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 12px; z-index: 10; }
  #panel h1 { font-size: 13px; margin: 0 0 2px; letter-spacing: .02em; }
  #panel .sub { font-size: 11px; opacity: .6; margin-bottom: 10px; }
  fieldset { border: 0; border-top: 1px solid rgba(255,255,255,.1); margin: 0 0 8px; padding: 8px 0 0; }
  legend { font-size: 10px; text-transform: uppercase; letter-spacing: .09em; opacity: .55; padding: 0 4px 0 0; }
  .row { display: flex; gap: 4px; flex-wrap: wrap; }
  button { flex: 1; min-width: 52px; padding: 5px 6px; font: inherit; font-size: 11px; cursor: pointer;
    background: rgba(255,255,255,.07); color: #f2eee9; border: 1px solid rgba(255,255,255,.14);
    border-radius: 7px; }
  button:hover { background: rgba(255,255,255,.14); }
  button.on { background: #e8834b; border-color: #e8834b; color: #1a1218; font-weight: 600; }
  label.chk { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 2px 0; cursor: pointer; }
  label.chk input { accent-color: #e8834b; }
  label.chk .sw { width: 10px; height: 10px; border-radius: 2px; flex: 0 0 auto; }
  pre { margin: 0; font: 11px/1.5 ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    white-space: pre; overflow-x: auto; opacity: .92; }
  .fields { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 4px 6px; align-items: center;
    font-size: 11px; margin-top: 6px; }
  .fields input { width: 100%; padding: 3px 5px; font: inherit; font-size: 11px; background: rgba(0,0,0,.35);
    border: 1px solid rgba(255,255,255,.16); border-radius: 5px; color: #f2eee9; }
  #sel { font-size: 11px; opacity: .8; margin-top: 4px; }
  #hint { position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%); z-index: 10;
    background: rgba(22,19,28,.85); border: 1px solid rgba(255,255,255,.12); border-radius: 9px;
    padding: 6px 12px; font-size: 11px; opacity: .8; pointer-events: none; }
  @media (max-width: 640px) { #panel { width: calc(100vw - 20px); max-height: 46vh; } }
</style>
</head>
<body>
<div id="panel">
  <h1>1P — koncept firemní budovy</h1>
  <div class="sub">Etapa 1 · 18 × 28 m · okap 6 m</div>

  <fieldset><legend>Kamera</legend>
    <div class="row">
      <button id="cam-orbit" class="on">Orbit</button>
      <button id="cam-walk">Procházka</button>
    </div>
  </fieldset>

  <fieldset><legend>Obálka</legend>
    <div class="row">
      <button id="cut-auto" class="on">Auto</button>
      <button id="cut-open">Otevřít</button>
      <button id="cut-solid">Celek</button>
    </div>
  </fieldset>

  <fieldset><legend>Podlaží</legend>
    <div class="row">
      <button id="lvl-all" class="on">Vše</button>
      <button id="lvl-0">Přízemí</button>
      <button id="lvl-1">Patro</button>
    </div>
  </fieldset>

  <fieldset><legend>Vrstvy</legend>
    <label class="chk"><input type="checkbox" id="ly-blocks" checked> Funkční bloky</label>
    <label class="chk"><input type="checkbox" id="ly-labels" checked> Popisky a plochy</label>
    <label class="chk"><input type="checkbox" id="ly-structure" checked> Nosná konstrukce</label>
    <label class="chk"><input type="checkbox" id="ly-stage2" checked> Etapa 2 (obrys)</label>
  </fieldset>

  <fieldset><legend>Rozvody</legend>
    <div id="mep-toggles"></div>
  </fieldset>

  <fieldset><legend>Editace</legend>
    <div class="row"><button id="edit-toggle">Editace vypnuta</button></div>
    <div id="sel">Nic není vybráno.</div>
    <div class="fields" id="sel-fields" style="display:none">
      <span>x od</span><input id="f-x0" type="number" step="0.5">
      <span>x do</span><input id="f-x1" type="number" step="0.5">
      <span>z od</span><input id="f-z0" type="number" step="0.5">
      <span>z do</span><input id="f-z1" type="number" step="0.5">
    </div>
    <div class="row" style="margin-top:6px">
      <button id="btn-export">Uložit spec</button>
      <button id="btn-reset">Reset</button>
    </div>
  </fieldset>

  <fieldset><legend>Souhrn</legend>
    <pre id="summary"></pre>
  </fieldset>
</div>

<div id="hint">Orbit: táhni myší · kolečko = zoom · pravé tlačítko = posun</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
